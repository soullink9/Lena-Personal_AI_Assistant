feel:
  fields:
    moment:
      required: true
      example: Pleased
      selector:
        text:
    reason:
      example: Alex thanked her for sorting the heating.
      selector:
        text:

add_event:
  fields:
    calendar:
      example: Personal
      selector:
        text:
    title:
      required: true
      example: Dentist
      selector:
        text:
    start:
      required: true
      example: "2026-11-14T15:30"
      selector:
        text:
    end:
      example: "2026-11-14T16:30"
      selector:
        text:
    location:
      selector:
        text:
    description:
      selector:
        text:

announce:
  fields:
    device_id:
      selector:
        device:
          integration: lena
          multiple: true
    message:
      required: true
      example: Dinner's ready!
      selector:
        text:
    listen:
      default: false
      selector:
        boolean:
