# Makes sure every release made on Gitea gets its GitHub release.
#
# Gitea is where releases are made (.gitea/workflows/release.yml), and its push mirror brings the new tag here
# every few hours. The tag normally starts release.yml by itself, which builds, signs and publishes the same
# version here. GitHub starts nothing for the tags of a push that brings more than three at once, though (several
# releases between two mirror pushes), and a run can be missed. So after each mirror push, and every few hours in
# case one is missed, this finds the versions with a tag here but no release (scripts/missing_releases.py says
# which count) and starts release.yml for each of them, on its tag. Nothing is built or published by this
# workflow itself, and it never starts one twice: a version whose release run failed is reported instead.
#
# Gitea doesn't read .github/, so this only ever runs on GitHub.
name: Catch up releases

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write # to start release.yml

# One at a time, so two runs never start the same release.
concurrency:
  group: catch-up-releases
  cancel-in-progress: false

jobs:
  catch-up:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # A mirror push that brings a tag along with main also starts release.yml for it: give that run time to
      # show up, so it isn't started a second time here.
      - name: Wait for releases the push started
        if: github.event_name == 'push'
        run: sleep 90

      - name: Start the missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git ls-remote --tags --refs origin | sed 's#.*refs/tags/##' > "$RUNNER_TEMP/tags.txt"
          gh release list --limit 200 --json tagName,isDraft > "$RUNNER_TEMP/releases.json"
          gh run list --workflow release.yml --limit 200 --json headBranch,status,conclusion > "$RUNNER_TEMP/runs.json"
          python3 scripts/missing_releases.py "$RUNNER_TEMP/tags.txt" "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/runs.json" \
            > "$RUNNER_TEMP/actions.txt"
          started=0
          while read -r kind text; do
            case "$kind" in
              release)
                echo "Starting the release of $text"
                # On the tag, so it builds exactly the released commit.
                gh workflow run release.yml --ref "$text" -f version="${text#[vV]}"
                started=$((started + 1))
                ;;
              warning)
                echo "::warning::$text"
                ;;
            esac
          done < "$RUNNER_TEMP/actions.txt"
          echo "Started $started release(s)."
          echo "### Catch up releases: started $started" >> "$GITHUB_STEP_SUMMARY"
