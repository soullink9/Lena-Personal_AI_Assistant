# Builds the app on GitHub for every change to it, and keeps the APK as the run's artifact (a test build).
# Releases are published by release.yml, on GitHub, and by .gitea/workflows/release.yml on Gitea, which is where
# the project lives; this repository is its public mirror.
name: Build APK

on:
  push:
    branches: [main]
    # Only the app needs building; docs and Home Assistant files don't.
    paths: ["android/**", "tools/frontend_check/**", "tools/commands_check/**", "tools/pairing_check/**", "tools/camera_check/**", "scripts/build_apk.sh", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GRADLE_VERSION: "8.14.3"
    steps:
      - uses: actions/checkout@v5

      # Requested default changes (adjustments/defaults.env, a value after a setting's =) are applied before every build;
      # list any still waiting in the run's summary. The release workflows won't publish while one is.
      - name: Default settings waiting
        run: |
          waiting=$(python3 tools/defaults.py waiting || true)
          {
            echo "### Default settings"
            if [ -n "$waiting" ]; then
              echo "Waiting to be applied (python3 tools/defaults.py apply):"
              echo "$waiting"
            else
              echo "Nothing waiting."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$waiting" ]; then echo "::warning file=adjustments/defaults.env::Default changes waiting to be applied"; fi

      # Plain Gradle download, checked against Gradle's published SHA-256. No third-party setup actions.
      - name: Install Gradle
        run: |
          cd "$RUNNER_TEMP"
          zip="gradle-${GRADLE_VERSION}-bin.zip"
          curl -fsSLO "https://services.gradle.org/distributions/${zip}"
          echo "$(curl -fsSL "https://services.gradle.org/distributions/${zip}.sha256")  ${zip}" | sha256sum -c -
          unzip -q "$zip"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lena.jks"
            echo "LENA_KEYSTORE=$RUNNER_TEMP/lena.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_B64 secret. The APK is debug-signed and won't install over a previous build."
          fi

      # The wake word models are in android/app/src/main/assets/wakeword/; nothing is downloaded for them.
      # The "Lena" model only works if the app computes exactly the features it was trained on.
      - name: Check the wake word front end against the original C
        run: tools/frontend_check/run.sh

      # What she understands on her own (timers, alarms, "stop"), on example sentences.
      - name: Check timers and alarms by voice
        run: tools/commands_check/run.sh

      # Set up from your phone: the QR code, the page it serves used as a phone would, and the page's cipher.
      - name: Check setting up from a phone
        run: tools/pairing_check/run.sh

      # Camera mode: the cameras and sensors it finds, and what it shows as motion comes and goes.
      - name: Check camera mode
        run: tools/camera_check/run.sh

      # Uses the JDK and Android SDK already on GitHub's Ubuntu runner. A test build is named after its commit.
      - name: Build
        env:
          LENA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          export JAVA_HOME="${JAVA_HOME_21_X64:-$JAVA_HOME_17_X64}"
          scripts/build_apk.sh "${GITHUB_SHA::7}"

      - uses: actions/upload-artifact@v7
        with:
          name: lena-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/SHA256SUMS
          if-no-files-found: error
