name: Home Assistant integration

# Tests custom_components/lena against a real Home Assistant.
on:
  push:
    branches: [main]
    paths: ["home-assistant/**", ".github/workflows/home-assistant.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The newest Home Assistant, and the oldest the integration supports.
        home-assistant: ["latest", "2026.9"]
    name: test (Home Assistant ${{ matrix.home-assistant }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Home Assistant's test harness
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.home-assistant }}" = "latest" ]; then
            pip install pytest-homeassistant-custom-component
          else
            # The test harness is released once per Home Assistant version; find the newest one for this release.
            harness=$(python - "${{ matrix.home-assistant }}" <<'PY'
          import json, sys, urllib.request
          want = sys.argv[1] + "."
          info = json.load(urllib.request.urlopen("https://pypi.org/pypi/pytest-homeassistant-custom-component/json"))
          for version in sorted(info["releases"], key=lambda v: [int(x) if x.isdigit() else 0 for x in v.split(".")], reverse=True):
              meta = json.load(urllib.request.urlopen(f"https://pypi.org/pypi/pytest-homeassistant-custom-component/{version}/json"))
              if any(r.replace(" ", "").startswith("homeassistant==" + want) for r in meta["info"].get("requires_dist") or []):
                  print(version)
                  break
          PY
            )
            echo "Test harness $harness"
            pip install "pytest-homeassistant-custom-component==$harness"
          fi
          # Her tools are called through the conversation integration; install what it needs, at the
          # versions this Home Assistant pins.
          reqs=$(python -c "import json, pathlib, homeassistant; m = pathlib.Path(homeassistant.__file__).parent / 'components' / 'conversation' / 'manifest.json'; print(' '.join(json.loads(m.read_text())['requirements']))")
          echo "Installing: $reqs"
          pip install $reqs
          python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"
      - name: Test
        working-directory: home-assistant
        run: |
          set -o pipefail
          if ! python -m pytest -q -p no:cacheprovider 2>&1 | tee "$RUNNER_TEMP/pytest.log"; then
            # Put the failures in the run summary, so they can be read without opening the full log.
            msg=$(grep -E "^(FAILED|ERROR)|Error|assert |^E  " "$RUNNER_TEMP/pytest.log" | head -80 \
              | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Tests failed::${msg:-see the log}"
            exit 1
          fi
          ha=$(python -c "import homeassistant.const as c; print(c.__version__)")
          echo "::notice title=Home Assistant $ha::$(tail -1 "$RUNNER_TEMP/pytest.log")"
