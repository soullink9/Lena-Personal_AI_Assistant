name: Home Assistant integration

# Tests custom_components/lena against a real Home Assistant, and checks it the way Home Assistant
# (hassfest) and HACS / Home Assistant's Marketplace do. The tests also run on the Gitea runner
# (.gitea/workflows/test.yml, with the same scripts); hassfest and HACS's checks are GitHub actions, so they
# run here only.
on:
  push:
    branches: [main]
    paths: ["custom_components/**", "home-assistant/**", "hacs.json", "scripts/*home_assistant.sh", ".github/workflows/home-assistant.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The newest Home Assistant the test harness supports, and the oldest Lena supports (keep that one
        # last: tools/check.py compares it with hacs.json). The start-up job below tries a release before
        # its harness is out.
        home-assistant: ["latest", "2026.9"]
    name: test (Home Assistant ${{ matrix.home-assistant }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # The same script the Gitea runner uses: the harness for this release, what Lena loads, then the tests.
      - name: Test
        run: scripts/test_home_assistant.sh "${{ matrix.home-assistant }}"

  startup:
    # The newest Home Assistant on PyPI, even before its test harness is out: Lena must load, her context
    # must answer over HTTP, and nothing it logs about her may be an error (home-assistant/startup_check.py).
    name: start-up (newest Home Assistant)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Start it with Lena
        run: scripts/start_home_assistant.sh

  hassfest:
    # Home Assistant's own checks for an integration: manifest, translations, services.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # What HACS (and Home Assistant's Marketplace, built from it) checks before it can install Lena.
    # HACS only validates public repositories, so this waits until the repository is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    steps:
      - uses: hacs/action@main
        with:
          category: integration
