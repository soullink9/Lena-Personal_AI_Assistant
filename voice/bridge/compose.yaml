# Lena voice bridge: put it on the same Docker network as Open WebUI and your Wyoming containers.
services:
  lena-voice:
    build: .
    container_name: lena-voice
    restart: unless-stopped
    environment:
      PIPER_HOST: wyoming-piper          # your Piper container's name on the network
      PIPER_PORT: "10200"
      PIPER_VOICE: en_US-lessac-medium   # the voice Home Assistant uses (optional)
      # Optional: also use your Whisper container for speech-to-text.
      # Leave these out to keep Open WebUI's built-in Whisper.
      WHISPER_HOST: wyoming-whisper
      WHISPER_PORT: "10300"
      WHISPER_LANGUAGE: en
      # Optional: her voice follows her mood (slower and lower when she's tired, brighter when she's
      # cheerful). Any Home Assistant user's long-lived access token works; leave these out to turn it off.
      # HA_URL: http://homeassistant:8123
      # HA_TOKEN: ${HA_TOKEN}             # a long-lived access token, from an .env file next to this one
    networks:
      - llm
    # No ports: only containers on the network (Open WebUI) can reach it.

networks:
  llm:
    external: true   # the network from ollama/docker-compose.example.yml; change to yours
