# Lena voice bridge: put it on the same Docker network as Open WebUI and your Wyoming containers.
services:
  lena-voice:
    # The image each release publishes (on ghcr.io, for amd64 and arm64). `docker compose up -d` pulls it, or builds
    # it from the Dockerfile here when it can't be pulled; `docker compose up -d --build` always builds it here.
    # To use another image, for example a fixed version or your own Gitea's, set LENA_VOICE_IMAGE in .env:
    #   LENA_VOICE_IMAGE=ghcr.io/soullink9/lena-voice-bridge:0.6.48
    image: ${LENA_VOICE_IMAGE:-ghcr.io/soullink9/lena-voice-bridge:latest}
    build: .
    container_name: lena-voice
    restart: unless-stopped
    environment:
      # Required: only callers with this key (Open WebUI's audio settings, API Key) can use the bridge.
      # Put LENA_VOICE_API_KEY=<a long random string> in an .env file next to this one (openssl rand -hex 32).
      API_KEY: ${LENA_VOICE_API_KEY:?Set LENA_VOICE_API_KEY in an .env file next to compose.yaml}
      PIPER_HOST: wyoming-piper          # your Piper container's name on the network
      PIPER_PORT: "10200"
      PIPER_VOICE: en_US-lessac-medium   # the voice Home Assistant uses (optional)
      # Optional: also use your Whisper container for speech-to-text.
      # Leave these out to keep Open WebUI's built-in Whisper.
      WHISPER_HOST: wyoming-whisper
      WHISPER_PORT: "10300"
      WHISPER_LANGUAGE: en
      # Optional: her voice follows her mood (slower and lower when she's tired, brighter when she's
      # cheerful). A long-lived access token of an admin, or of a user allowed in Lena's options (Who may use
      # Lena); leave these out to turn it off.
      # HA_URL: http://homeassistant:8123
      # HA_TOKEN: ${HA_TOKEN}             # a long-lived access token, from an .env file next to this one
    networks:
      - llm
    # No ports: only containers on the network (Open WebUI) can reach it. Don't publish its port on the host.

networks:
  llm:
    external: true   # the network from ollama/docker-compose.example.yml; change to yours
