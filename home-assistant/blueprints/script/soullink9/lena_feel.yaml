# =============================================================================
# Lena feel (script blueprint)
# =============================================================================
# Lets Lena record how something just made her feel: thanked, insulted,
# amused, asked the same thing for the fifth time. It sets her Moment and its
# reason, which her prompt reads, and the Lena Mood Engine lets it fade after
# a few minutes.
#
# SET UP (all in the Home Assistant UI)
#   1. Settings > Automations & scenes > Scripts > Create script > from this
#      blueprint. Name it "Lena feel" and keep the description it shows.
#   2. Pick her Moment dropdown and Moment reason text helper.
#   3. Expose the script to Assist (Settings > Voice assistants > Expose), so
#      her Home Assistant agent can call it. Open WebUI calls it through the
#      Lena tool in open-webui/ instead.
#
# The moment names below must match her Moment dropdown and
# custom_templates/lena.jinja. tools/check.py checks that.
# =============================================================================

blueprint:
  name: Lena feel
  description: >-
    A tool for Lena: records how something someone said or did just made her
    feel, by setting her Moment and its reason. Expose the script to Assist.
  domain: script
  source_url: https://github.com/soullink9/Lena-Personal_AI_Assistant/blob/main/home-assistant/blueprints/script/soullink9/lena_feel.yaml
  homeassistant:
    min_version: 2025.4.0
  input:
    moment_entity:
      name: Moment dropdown
      selector:
        entity:
          filter:
            domain: input_select
    moment_reason_entity:
      name: Moment reason text
      selector:
        entity:
          filter:
            domain: input_text

# This is what the model reads to decide when to use it. Keep it specific,
# or small models call it on every request.
description: >-
  Record how something the person just said or did made you feel. Use it only
  when it genuinely affects you: real thanks or praise, a kind or personal
  word, something funny, rudeness, or the same request yet again. Never for
  ordinary requests, and at most once per reply. Don't mention using it.
fields:
  moment:
    name: Moment
    description: How it made you feel.
    required: true
    selector:
      select:
        options:
          - Pleased
          - Amused
          - Proud
          - Touched
          - Delighted
          - Exasperated
          - Offended
  reason:
    name: Reason
    description: >-
      What happened, in a few words, written to yourself.
      For example "Alex thanked you for sorting the heating."
    required: true
    selector:
      text: {}

variables:
  moment_entity: !input moment_entity
  moment_reason_entity: !input moment_reason_entity

sequence:
  - if:
      - condition: template
        value_template: "{{ moment in (state_attr(moment_entity, 'options') or []) }}"
    then:
      # The reason first, so her prompt never pairs a new moment with an old reason.
      - action: input_text.set_value
        target:
          entity_id: !input moment_reason_entity
        data:
          value: "{{ (reason | default('') | trim)[:(state_attr(moment_reason_entity, 'max') or 100) | int] }}"
      - action: input_select.select_option
        target:
          entity_id: !input moment_entity
        data:
          option: "{{ moment }}"

mode: queued
max: 5
