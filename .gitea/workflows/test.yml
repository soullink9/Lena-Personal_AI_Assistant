# Runs every test on each push and pull request, on your own Gitea runner.
#
# It uses no actions: actions/checkout, setup-python and the like are downloaded from GitHub, so a GitHub outage
# would stop every run. Instead each job runs in a plain image from Docker Hub that already has what it needs,
# and gets the code from Gitea with git. What the images don't have comes from where it's published (PyPI for
# Home Assistant, Google for the Android SDK and the app's libraries), never from GitHub.
#
# Gitea only reads .gitea/workflows when it exists, so GitHub's workflows in .github/ never run here.
name: Test

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # Gitea's address as the job containers can reach it, if that isn't its public address (ROOT_URL): for a runner
  # next to Gitea, e.g. http://gitea-server:3000. Set it once as an Actions variable on your user or organisation.
  GITEA_INTERNAL_URL: ${{ vars.GITEA_INTERNAL_URL }}

# Every step runs in bash, as on GitHub. Gitea's runner otherwise uses sh, which lacks what the steps use
# (${GITHUB_SHA::7}, pipefail); every image here has bash.
defaults:
  run:
    shell: bash

jobs:
  checks:
    # tools/check.py and the release scripts' tests, on Python 3.13: the voice bridge's Python
    # (voice/bridge/Dockerfile), and new enough for the integration's code, which only ever runs on Home
    # Assistant's own Python (the jobs below test it there).
    runs-on: ubuntu-latest
    container:
      image: python:3.13-bookworm
    steps:
      - name: Get the code
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git init -q .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          repo="${GITEA_INTERNAL_URL:-$GITHUB_SERVER_URL}/$GITHUB_REPOSITORY.git"
          # the exact commit that started the run; its branch or pull request as a fallback
          git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_SHA" ||
            git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_REF"
          git checkout -q FETCH_HEAD
          git log -1 --format='Testing %h %s'

      - name: Install the checks' one package (PyYAML, from PyPI)
        run: pip install -q --root-user-action=ignore --disable-pip-version-check pyyaml

      # Versions, defaults, private data, approved dependencies... and tests/test_release.py.
      - name: Offline checks and the release scripts
        run: python3 tools/check.py

  open-webui:
    # Open WebUI runs her filter and tool on its own Python 3.11, the oldest any of Lena's code meets, so they must
    # compile there.
    runs-on: ubuntu-latest
    container:
      image: python:3.11-bookworm
    steps:
      - name: Get the code
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git init -q .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          repo="${GITEA_INTERNAL_URL:-$GITHUB_SERVER_URL}/$GITHUB_REPOSITORY.git"
          git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_SHA" ||
            git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      - name: The Open WebUI filter and tool compile on Python 3.11
        run: python3 -m py_compile open-webui/lena_filter.py open-webui/lena_tools.py

  home-assistant:
    # The integration in a real Home Assistant: the newest release its test harness supports, and the oldest Lena
    # supports (keep that one last: tools/check.py compares it with hacs.json). Python 3.14, which both run on.
    strategy:
      fail-fast: false
      matrix:
        home-assistant: ["latest", "2026.9"]
    runs-on: ubuntu-latest
    container:
      image: python:3.14-bookworm
    steps:
      - name: Get the code
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git init -q .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          repo="${GITEA_INTERNAL_URL:-$GITHUB_SERVER_URL}/$GITHUB_REPOSITORY.git"
          git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_SHA" ||
            git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      - name: Test on Home Assistant ${{ matrix.home-assistant }}
        run: scripts/test_home_assistant.sh "${{ matrix.home-assistant }}"

  startup:
    # The newest Home Assistant on PyPI, even before its test harness is out.
    runs-on: ubuntu-latest
    container:
      image: python:3.14-bookworm
    steps:
      - name: Get the code
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git init -q .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          repo="${GITEA_INTERNAL_URL:-$GITHUB_SERVER_URL}/$GITHUB_REPOSITORY.git"
          git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_SHA" ||
            git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      - name: Start the newest Home Assistant with Lena
        run: scripts/start_home_assistant.sh

  app:
    # The official Gradle image (Gradle 8.14.3, JDK 21, Ubuntu) has no Android SDK; scripts/android_sdk.sh fetches
    # it from Google. A test build isn't signed or kept: it proves the app compiles.
    runs-on: ubuntu-latest
    container:
      image: gradle:8.14.3-jdk21
    env:
      ANDROID_HOME: /opt/android-sdk
    steps:
      # The wake word check compiles the original C (g++) and makes its test audio with Python; the phone setup
      # check runs the phone page's cipher in Node (nodejs).
      - name: Install the build tools (from Ubuntu)
        # Retried, over IPv4 (a runner without IPv6 otherwise waits on it first), so a short outage of
        # Ubuntu's servers doesn't fail the run; a longer one still does, and re-running the job is the fix.
        run: |
          apt="apt-get -qq -o Acquire::Retries=5 -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=30"
          for attempt in 1 2 3; do
            if $apt update && DEBIAN_FRONTEND=noninteractive $apt install -y --no-install-recommends git curl unzip g++ python3 nodejs > /dev/null; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Ubuntu's package servers didn't answer (attempt $attempt of 3); trying again in 30 seconds."
              sleep 30
            fi
          done
          echo "::error::Couldn't reach Ubuntu's package servers (archive.ubuntu.com) from the runner. Re-run the job when they're back."
          exit 1

      - name: Get the code
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git init -q .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          repo="${GITEA_INTERNAL_URL:-$GITHUB_SERVER_URL}/$GITHUB_REPOSITORY.git"
          git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_SHA" ||
            git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      # Requested default changes (adjustments/defaults.env) are applied before every build; say if any are waiting.
      # The release workflow won't publish while one is.
      - name: Default settings waiting
        run: |
          if ! python3 tools/defaults.py waiting; then
            echo "::warning file=adjustments/defaults.env::Default changes waiting to be applied (python3 tools/defaults.py apply)"
          fi

      # The "Lena" wake word model only works if the app computes exactly the features it was trained on.
      - name: Check the wake word front end against the original C
        run: tools/frontend_check/run.sh

      # What she understands on her own (timers, alarms, "stop"), on example sentences.
      - name: Check timers and alarms by voice
        run: tools/commands_check/run.sh

      # Set up from your phone: the QR code, the page it serves used as a phone would, and the page's cipher.
      - name: Check setting up from a phone
        run: tools/pairing_check/run.sh

      # Camera mode: the cameras and sensors it finds, and what it shows as motion comes and goes.
      - name: Check camera mode
        run: tools/camera_check/run.sh

      # Connections: which failed requests are tried again (never a POST that may have reached the server),
      # and how an answer being written is followed.
      - name: Check connection rules
        run: tools/connection_check/run.sh

      - name: Install the Android SDK (from Google)
        run: scripts/android_sdk.sh

      - name: Build the app
        run: scripts/build_apk.sh "${GITHUB_SHA::7}"
