# Publishes a release on Gitea: Lena's signed APK and its SHA256SUMS, with notes from that version's section of
# CHANGELOG.md. Then the voice bridge's Docker image, to Gitea's container registry (the voice-bridge-image job).
#
# Two ways to start it:
#   - Actions tab → Release → Run workflow, and enter the version (0.6.12). This also creates the tag (v0.6.12) on
#     the commit it releases.
#   - Push a version tag:  git tag v0.6.12 && git push origin v0.6.12
# It refuses to publish unless every part of the project (the app, the integration, the Open WebUI files, the
# voice bridge) and CHANGELOG.md are at that version, no default setting is waiting to be applied, the APK is
# signed with your key, and every test passes, so a release always matches the code in it. Lena's versions are
# plain numbers, so there are no pre-releases.
#
# With Gitea push-mirroring to GitHub, the new tag reaches GitHub too, and GitHub's own release workflow
# (.github/workflows/release.yml) publishes the same release there, which is where the app updates from. If the
# tag doesn't start it (GitHub starts nothing for a push of more than three tags), .github/workflows/
# catch-up-releases.yml starts it after the mirror's next push.
#
# Like test.yml it uses no actions, so it works when GitHub can't be reached. The release notes still point at
# the public copy on GitHub (PUBLIC_REPOSITORY), which is where people install from.
name: Release

on:
  push:
    tags: ["v*.*.*", "V*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 0.6.12)"
        required: true

env:
  PUBLIC_REPOSITORY: soullink9/Lena-Personal_AI_Assistant
  # Gitea's address as the job containers can reach it, if that isn't its public address (ROOT_URL): for a runner
  # next to Gitea, e.g. http://gitea-server:3000. Set it once as an Actions variable on your user or organisation.
  GITEA_INTERNAL_URL: ${{ vars.GITEA_INTERNAL_URL }}

# Every step runs in bash, as on GitHub. Gitea's runner otherwise uses sh, which lacks what the steps use
# (${GITHUB_SHA::7}, pipefail); every image here has bash.
defaults:
  run:
    shell: bash

# The same tests as test.yml, then the release job, which only starts when they've all passed.

jobs:
  checks:
    # tools/check.py and the release scripts' tests, on Python 3.13: the voice bridge's Python
    # (voice/bridge/Dockerfile), and new enough for the integration's code, which only ever runs on Home
    # Assistant's own Python (the jobs below test it there).
    runs-on: ubuntu-latest
    container:
      image: python:3.13-bookworm
    steps:
      - name: Get the code
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git init -q .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          repo="${GITEA_INTERNAL_URL:-$GITHUB_SERVER_URL}/$GITHUB_REPOSITORY.git"
          # the exact commit that started the run; its branch or pull request as a fallback
          git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_SHA" ||
            git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_REF"
          git checkout -q FETCH_HEAD
          git log -1 --format='Testing %h %s'

      - name: Install the checks' one package (PyYAML, from PyPI)
        run: pip install -q --root-user-action=ignore --disable-pip-version-check pyyaml

      # Versions, defaults, private data, approved dependencies... and tests/release/test_release.py.
      - name: Offline checks and the release scripts
        run: python3 tools/check.py

  open-webui:
    # Open WebUI runs her filter and tool on its own Python 3.11, the oldest any of Lena's code meets, so they must
    # compile there.
    runs-on: ubuntu-latest
    container:
      image: python:3.11-bookworm
    steps:
      - name: Get the code
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git init -q .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          repo="${GITEA_INTERNAL_URL:-$GITHUB_SERVER_URL}/$GITHUB_REPOSITORY.git"
          git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_SHA" ||
            git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      - name: The Open WebUI filter and tool compile on Python 3.11
        run: python3 -m py_compile open-webui/lena_filter.py open-webui/lena_tools.py

  home-assistant:
    # The integration in a real Home Assistant: the newest release its test harness supports, and the release Lena
    # targets (keep that one last: tools/check.py compares it with hacs.json). Lena supports only that release and
    # newer; until the harness for it is out, the tests are skipped with a warning and the start-up job checks her.
    # Python 3.14, which both run on.
    strategy:
      fail-fast: false
      matrix:
        home-assistant: ["latest", "2026.11"]
    runs-on: ubuntu-latest
    container:
      image: python:3.14-bookworm
    steps:
      - name: Get the code
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git init -q .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          repo="${GITEA_INTERNAL_URL:-$GITHUB_SERVER_URL}/$GITHUB_REPOSITORY.git"
          git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_SHA" ||
            git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      - name: Test on Home Assistant ${{ matrix.home-assistant }}
        run: scripts/test_home_assistant.sh "${{ matrix.home-assistant }}"

  startup:
    # The newest Home Assistant on PyPI, even before its test harness is out.
    runs-on: ubuntu-latest
    container:
      image: python:3.14-bookworm
    steps:
      - name: Get the code
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git init -q .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          repo="${GITEA_INTERNAL_URL:-$GITHUB_SERVER_URL}/$GITHUB_REPOSITORY.git"
          git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_SHA" ||
            git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      - name: Start the newest Home Assistant with Lena
        run: scripts/start_home_assistant.sh

  release:
    needs: [checks, open-webui, home-assistant, startup]
    runs-on: ubuntu-latest
    container:
      image: gradle:8.14.3-jdk21
    env:
      ANDROID_HOME: /opt/android-sdk
    steps:
      # The wake word check compiles the original C (g++); the release scripts are Python.
      - name: Install the build tools (from Ubuntu)
        # Retried, over IPv4 (a runner without IPv6 otherwise waits on it first), so a short outage of
        # Ubuntu's servers doesn't fail the run. apt's own output is kept and shown (folded when it worked, in
        # full when it didn't), each try has a time limit so a stuck download fails instead of hanging the job,
        # and only a network problem is tried again: anything else fails at once with apt's message.
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo=""
          if [ "$(id -u)" -ne 0 ]; then
            if command -v sudo > /dev/null; then sudo="sudo -E"; else
              echo "::error::This step installs packages and needs root, but the job runs as $(id -un) and the image has no sudo. Run the job's container as root."
              exit 1
            fi
          fi
          apt="$sudo apt-get -q -o Acquire::Retries=5 -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=30 -o Dpkg::Use-Pty=0 -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold"
          packages="git curl unzip g++ python3 nodejs"
          log=$(mktemp)
          network='Failed to fetch|Could not resolve|Temporary failure|Could not connect|Connection timed out|Connection failed|Unable to connect|Hash Sum mismatch|Unable to locate package|Some index files failed'
          # Runs apt with a time limit and keeps its output; says what failed, and returns 2 when it was the network.
          run() {
            what=$1 limit=$2; shift 2
            echo "$what..."
            rc=0
            timeout "$limit" "$@" > "$log" 2>&1 || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "::group::apt's output ($what)"; cat "$log"; echo "::endgroup::"
              return 0
            fi
            echo "---- apt's output ($what, exit code $rc) ----"; cat "$log"; echo "----"
            if [ "$rc" -eq 124 ]; then echo "$what took longer than $limit and was stopped."; return 2; fi
            if grep -Eq "$network" "$log"; then return 2; fi
            return 1
          }
          for attempt in 1 2 3; do
            rc=0
            run "Downloading Ubuntu's package lists (attempt $attempt of 3)" 10m $apt update || rc=$?
            # apt update can finish with only a warning when a server didn't answer; the install then says so.
            [ "$rc" -eq 0 ] && { run "Installing $packages" 20m $apt install -y --no-install-recommends $packages || rc=$?; }
            if [ "$rc" -eq 0 ]; then
              for tool in git curl unzip g++ python3 node; do
                command -v "$tool" > /dev/null || { echo "::error::apt finished but $tool isn't installed. See apt's output above."; exit 1; }
              done
              echo "Installed: $packages."
              exit 0
            fi
            if [ "$rc" -eq 1 ]; then
              echo "::error::apt couldn't install the build tools, and it wasn't the network; apt's message is just above. Trying again won't help."
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Ubuntu's package servers didn't answer (attempt $attempt of 3); trying again in 30 seconds."
              sleep 30
            fi
          done
          echo "::error::Couldn't reach Ubuntu's package servers from the runner after 3 tries (apt's messages are above). Re-run the job when they're back."
          exit 1

      - name: Get the code
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git init -q .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          repo="${GITEA_INTERNAL_URL:-$GITHUB_SERVER_URL}/$GITHUB_REPOSITORY.git"
          git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_SHA" ||
            git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v${INPUT_VERSION#[vV]}"  # (a "v" typed by mistake is fine)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check the version and take the release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: python3 scripts/release_notes.py "$TAG" "$PUBLIC_REPOSITORY" notes.md >> "$GITHUB_OUTPUT"

      # Every requested default change must be applied (and reviewed) before a release.
      - name: No default changes waiting
        run: |
          if ! python3 tools/defaults.py waiting; then
            echo "::error file=adjustments/defaults.env::Apply the requested default changes before releasing (python3 tools/defaults.py apply)"
            exit 1
          fi

      - name: Check the wake word front end against the original C
        run: tests/app/frontend_check/run.sh

      - name: Check timers and alarms by voice
        run: tests/app/commands_check/run.sh

      # Set up from your phone: the QR code, the page it serves used as a phone would, and the page's cipher.
      - name: Check setting up from a phone
        run: tests/app/pairing_check/run.sh

      # Camera mode: the cameras and sensors it finds, and what it shows as motion comes and goes.
      - name: Check camera mode
        run: tests/app/camera_check/run.sh

      # Connections: which failed requests are tried again (never a POST that may have reached the server),
      # and how an answer being written is followed.
      - name: Check connection rules
        run: tests/app/connection_check/run.sh

      # One display answers: how loud the wake word was above the room's noise, and what each display says
      # it's doing (listening, thinking, speaking) for Home Assistant.
      - name: Check wake word claims and display state
        run: tests/app/presence_check/run.sh

      # How much conversation a request to Open WebUI carries, so its Context Compaction never makes her
      # answer wait, and when a quiet chat is compacted instead.
      - name: Check context compaction rules
        run: tests/app/compaction_check/run.sh

      - name: Install the Android SDK (from Google)
        run: scripts/android_sdk.sh

      # A release must install over the last one, so it's signed with your key or not published at all.
      - name: Load the signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::No KEYSTORE_B64 secret: add it and KEYSTORE_PASSWORD to the repository's Actions secrets (docs/app/Installation.md)"
            exit 1
          fi
          keys="$(mktemp -d)"
          echo "$KEYSTORE_B64" | base64 -d > "$keys/lena.jks"
          echo "LENA_KEYSTORE=$keys/lena.jks" >> "$GITHUB_ENV"

      - name: Build the app
        env:
          LENA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TAG: ${{ steps.version.outputs.tag }}
        run: scripts/build_apk.sh "v${TAG#[vV]}"

      # The checks Lena's updater and Android make, before anyone else has to.
      - name: Check the APK
        env:
          APK: ${{ steps.notes.outputs.apk }}
        run: python3 scripts/check_apk.py "android/app/build/outputs/apk/release/$APK" android/app/build/outputs/apk/release/SHA256SUMS

      - name: Publish on Gitea
        env:
          # the job's own token; set a RELEASE_TOKEN secret instead if your Gitea doesn't let it make releases
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITEA_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ steps.version.outputs.commit }}
          TITLE: ${{ steps.notes.outputs.title }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
          APK: ${{ steps.notes.outputs.apk }}
        run: |
          out=android/app/build/outputs/apk/release
          python3 scripts/publish_gitea_release.py "$TAG" "$COMMIT" "$TITLE" notes.md "$PRERELEASE" "$out/$APK" "$out/SHA256SUMS"

  voice-bridge-image:
    # The voice bridge's Docker image, in this Gitea's container registry, once the release is out: tagged with the
    # version (0.6.48), and latest when it's the newest version. voice/bridge/compose.yaml can pull it
    # (docs/voice/Voice-Bridge.md). Built for the runner's own platform, with the runner's Docker: act_runner gives
    # it to its jobs unless its config.yaml sets container.docker_host to "-".
    # Gitea's own job token can't write packages, so this needs a REGISTRY_TOKEN secret: an access token with
    # write:package, of a user who can write the repository's packages (CONTRIBUTING.md#releasing).
    needs: [release]
    runs-on: ubuntu-latest
    container:
      image: docker:28-cli
    steps:
      # The image is Alpine with only sh: bash for the steps below, git to get the code, Python to pick latest.
      - name: Install bash, git and Python (from Alpine)
        shell: sh
        run: apk add --no-cache bash git python3

      - name: Get the code
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git init -q .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          repo="${GITEA_INTERNAL_URL:-$GITHUB_SERVER_URL}/$GITHUB_REPOSITORY.git"
          git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_SHA" ||
            git -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      # Latest only for the newest of Lena's version tags, judged by main's CHANGELOG.md (an older tag's doesn't
      # know the newer versions), so tags pushed together leave the newest as latest whichever run ends last.
      - name: Work out the version, and whether it's the newest
        id: version
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v${INPUT_VERSION#[vV]}"
          fi
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          repo="${GITEA_INTERNAL_URL:-$GITHUB_SERVER_URL}/$GITHUB_REPOSITORY.git"
          tools="$(mktemp -d)"
          git -C "$tools" init -q .
          git -C "$tools" -c http.extraHeader="Authorization: Basic $auth" fetch -q --depth 1 "$repo" main
          git -C "$tools" checkout -q FETCH_HEAD
          git -c http.extraHeader="Authorization: Basic $auth" ls-remote --tags --refs "$repo" |
            sed 's#.*refs/tags/##' > "$tools/tags"
          # A tag made by the release job (Run workflow) is there by now.
          grep -qxF "$tag" "$tools/tags" || echo "$tag" >> "$tools/tags"
          latest=$(python3 "$tools/scripts/missing_releases.py" --newest-tag "$tag" "$tools/tags")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "$tag, latest: $latest"

      - name: Publish the voice bridge image on Gitea
        env:
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          if [ -z "$REGISTRY_PASSWORD" ]; then
            echo "::error::No REGISTRY_TOKEN secret: add an access token with write:package to the repository's Actions secrets to publish the voice bridge image (CONTRIBUTING.md#releasing). The release itself is published."
            exit 1
          fi
          # Gitea's registry is at its public address (ROOT_URL), which is what docker pull uses too.
          registry="${GITHUB_SERVER_URL#*://}"
          registry="${registry%/}"
          export IMAGE="$registry/${GITHUB_REPOSITORY_OWNER,,}/lena-voice-bridge"
          export REGISTRY_USER="$GITHUB_REPOSITORY_OWNER"
          export SOURCE_URL="https://github.com/$PUBLIC_REPOSITORY"
          scripts/publish_voice_bridge_image.sh
